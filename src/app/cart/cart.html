<h2>Cart</h2>
<div class="cart-wrapper">
  @for (item of cartItems(); track item.product.id) {
    <div class="cart-item">
      <img [src]="item.product.productImagePath" [alt]="item.product.productName" />
      <div class="cart-details">
        <span>ProductName: {{ item.product.productName }}</span>
        <span>Price: {{ item.product.productPrice }}</span>
        <span>Category: {{ item.product.category }}</span>
        <span>Quantity in cart: {{ item.cartQuantity }}</span>
      </div>
      <button (click)="removeFromCart(item.product.id)">Remove from cart</button>
    </div>
  } @empty {
    <p>Your cart is empty.</p>
  }
</div>
